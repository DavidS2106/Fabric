# ======================================================================
# RECORD-LEVEL COMPARISON AND COMPARISON SETTINGS
# ======================================================================

validations:
  record_level_comparison:
    enabled: true
    supported_modes:
    - full_data_comparison
    - sample_comparison
    large_table_fallback:
      enabled: true
      full_comparison_max_rows: 1000000
      fallback_mode: sample_comparison
      sample_record_limit: 900000

  comparison_settings:
    incremental_update_evidence_limit: 100
    default_mode: full_data_comparison
    supported_modes:
    - full_data_comparison
    - sample_comparison
    large_table_sampling:
      enabled: true
      row_count_threshold: 1000000
      # Source rows examined for a table at/above the threshold. This is a
      # coverage setting only; it never sizes a SQL statement.
      sample_size: 100000
      # Sampled comparisons that may hold their sample and cohort at once
      # across all tables (table parallelism stays as configured for
      # everything else).
      max_concurrent_comparisons: 1
    comparison_tiers:
      # Keyed tables: sampled keys per target statement. The statement is a
      # set-based VALUES join split into blocks of
      # performance.cohort_processing.values_join.max_keys rows each.
      # 100K sample / 5000 = ~20 statements.
      target_key_lookup_batch_size: 5000
      # Keyless tables: sampled rows per candidate lookup statement. The
      # statement joins on the discriminator columns below; candidates are
      # then compared exactly in Python on every configured column.
      target_keyless_lookup_batch_size: 5000
      # Compared columns used as the database-side candidate discriminator for
      # keyless tables (chosen per table from the sample for selectivity).
      keyless_discriminator_columns: 3
      # Candidate rows a keyless lookup batch may return per sampled row before
      # that batch is re-fetched with a wider discriminator (the next tier
      # doubles the columns, still one compact VALUES join). The widest tier
      # streams every candidate without a budget; retention stays bounded by
      # the source multiplicity. No all-column per-row predicate is generated.
      keyless_candidate_row_multiplier: 4
      # Widest discriminator a cohort may grow to (columns). Floating-point and
      # very long text columns are never used as database-side filters.
      keyless_discriminator_max_columns: 12
      # Target lookup batches (keyed pages and keyless cohorts) executed at the
      # same time inside ONE sampled table comparison. This is batch-level
      # concurrency; large_table_sampling.max_concurrent_comparisons above is
      # the table-level ceiling and stays independent. The effective value is
      # additionally capped by the target connection pool
      # (performance.connection_management.pool.pool_size + max_overflow) and
      # by performance.parallel_execution.global_max_concurrency, and never
      # exceeds the number of batches. When absent, the value falls back to
      # performance.parallel_execution.batch_parallelism.max_workers_per_table
      # (when that block is enabled), otherwise 1 (sequential).
      target_lookup_parallelism: 4
      # Optional per-connector override of target_lookup_parallelism, keyed by
      # the TARGET connector type (sqlserver | fabric). Absent types use the
      # value above.
      target_lookup_parallelism_by_connector:
        sqlserver: 4
        fabric: 4
      # When a lookup batch hits a statement timeout or resource-pressure error
      # the in-flight window is reduced (workers x reduce_factor, not below
      # min_workers) and that batch is retried once at the reduced level. The
      # sample, the batches and the comparison semantics never change; every
      # reduction is logged as [ADAPTIVE_PARALLELISM].
      adaptive_parallelism:
        enabled: true
        min_workers: 1
        reduce_factor: 0.5
    # Ceilings every generated cohort statement is checked against before it
    # is executed. A statement over a ceiling is split, never executed.
    query_safety:
      max_sql_length_bytes: 5000000
      max_predicates_per_query: 5000
    large_table_processing:
      enabled: true
      medium_table_threshold: 500000
      large_table_threshold: 2000000
    sampling:
      enabled: true
      default_sample_size: 100000
    supported_sampling_strategies:
    - deterministic
    - random
    default_sampling_strategy:
      type: deterministic
      key_source:
        type: table_yaml
    key_mapping_source:
      type: table_yaml
      path: migration-validator_v6/config/tables/<folder>/*.yaml
    missing_key_behavior:
      full_data_comparison: hash_full_comparison
      deterministic_sampling: random_sampling
      # A successful keyless/hash fallback is a completed comparison, so it
      # passes when no data mismatch is found. Actual mismatches still fail.
      fallback_status: PASS
      skip_status: SKIP
      error_status: CONFIG_ERROR
    null_handling:
      blank_is_null: false
      both_null: match
      one_null: mismatch
    timestamp_handling:
      parse_iso_strings: true
      preserve_precision: true
      precision_loss_behavior: mismatch
      fractional_second_tolerance: '0'
      out_of_range_strategy: native_or_string
      timezone_comparison: preserve
    hash_comparison:
      algorithm: sha256
      comparison_scope: configured_columns
      column_exclusions: []
      duplicate_handling: multiset
      # Keyless full comparison keeps complete row coverage, but reads and
      # hashes one small database batch at a time. Parallel source/target
      # frames can double peak memory on wide tables, so ingestion is
      # deliberately sequential.
      parallel_ingest: false
      ingest_workers: 1
      progress_interval_percent: 25
      spill:
        strategy: sqlite
        directory: output/temp/hash_comparison
        store_row_payloads: bounded
        commit_interval_batches: 20
      normalization:
        null_representation: <NULL>
        blank_handling: preserve
        trim_strings: false
        case_sensitive: true
        normalize_datatypes: true
        unicode_normalization: none
        numeric_normalization: canonical_decimal
        date_normalization: iso8601
        timestamp_normalization: precision_aware
        timezone_normalization: preserve
        precision_normalization: preserve
    full_data_comparison:
      enabled: true
      mode_name: full_data_comparison
      validation_scope_source: table_yaml
      consistency_requirement: stable_validation_window
      key_based:
        enabled: true
        strategy_name: KEY_BASED_FULL_COMPARISON
        validate_nulls: true
        validate_duplicates: true
        require_unique_keys: true
      hash_fallback:
        enabled: true
        strategy: hash_full_comparison
        strategy_name: HASH_BASED_FULL_COMPARISON
        warning_status: PASS
        warning_code: KEY_MAPPING_MISSING_HASH_FALLBACK
        warning_message: Key mapping unavailable or non-unique; hash-based full comparison used.
        trigger_conditions:
        - missing
        - empty
        - invalid
        - nulls
        - duplicates
        - non_unique
      batching:
        streaming_enabled: true
        database_pushdown_enabled: true
        memory_safe_processing: true
        parallel_execution:
          enabled: true
          worker_count: 2
        key_cohort_strategy: auto
        cohort_chunk_size: 10000
      reverse_pass:
        mode: when_counts_reconcile
        require_shared_statistics: true
      performance:
        prefer_dual_keyset_merge: true
        bounded_memory: true
        reuse_statistics: true
        reuse_comparison_counts: true
        vectorized_comparison: true
        source_target_read_parallelism:
          enabled: false
          bounded_concurrency: 2
        hash_first_comparison:
          enabled: true
      evidence:
        export_matched_records: true
        matched_records_limit: 100
        mismatch_sample_limit: 100
        export_all_excess_source: false
        export_all_excess_target: false
        excess_source_limit: 100
        excess_target_limit: 100
        row_hash_column: _RowHashValue
      count_names:
        matched: matched_records
        mismatched: mismatch_records
        excess_in_source: excess_in_source
        excess_in_target: excess_in_target
      excel_reports:
        enabled: true
        per_table:
          sheets:
          - summary
          - validation_checks
          - matched_records
          - mismatched_records
          - excess_in_source
          - excess_in_target
        sheet_names:
          summary: SUMMARY
          table_summary: TABLE_SUMMARY
          validation_checks: VALIDATION_CHECKS
          matched_records: MATCHED_RECORDS
          mismatched_records: MISMATCHED_RECORDS
          excess_in_source: EXCESS_IN_SOURCE
          excess_in_target: EXCESS_IN_TARGET
          reconciliation: RECONCILIATION
        overall_statuses:
        - PASS
        - FAIL
        - WARNING
        - ERROR
        - SKIP
        summary_severity_order:
        - ERROR
        - FAIL
        - WARNING
        - PASS
        - SKIP
        status_display:
          PASS: PASS
          FAIL: FAIL
          WARN: WARNING
          WARNING: WARNING
          ERROR: ERROR
          FRAMEWORK_ERROR: ERROR
          CONFIG_ERROR: ERROR
          SKIP: SKIP
        formatting:
          header_color: 1D4ED8
          header_font_color: FFFFFF
          freeze_panes: A2
          max_column_width: 60
          status_colors:
            PASS: 22C55E
            FAIL: EF4444
            WARNING: F59E0B
            ERROR: DC2626
            SKIP: 64748B
            DEFAULT: FFFFFF
    error_policy:
      framework_exception_status: FRAMEWORK_ERROR
      configuration_error_status: CONFIG_ERROR
      continue_after_check_error: true
      fatal_exception_categories: []
    status_policy:
      severity_order:
      - CONFIG_ERROR
      - FRAMEWORK_ERROR
      - FAIL
      - WARNING
      - PASS
      - SKIP
      table_impact:
        ERROR: FRAMEWORK_ERROR
        FRAMEWORK_ERROR: FRAMEWORK_ERROR
        CONFIG_ERROR: CONFIG_ERROR
        FAIL: FAIL
        WARN: WARNING
        WARNING: WARNING
        PASS: PASS
        SKIP: SKIP
